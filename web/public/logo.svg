<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- 光泽叠加 -->
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>
  <!-- 字母 H -->
  <text x="32" y="47" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900"
        text-anchor="middle" fill="white" letter-spacing="-1">H</text>
  <!-- 底部小标 -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="7" font-weight="600"
        text-anchor="middle" fill="white" opacity="0.75" letter-spacing="1">HANDY</text>
</svg>
